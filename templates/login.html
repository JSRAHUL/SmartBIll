<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - SmartBill POS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
      padding: 20px;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .demo-creds {
      margin-top: 24px;
      padding: 16px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="brand-icon" style="margin: 0 auto 12px; width: 48px; height: 48px; font-size: 1.4rem;">SB</div>
      <h2 style="font-size: 1.45rem; font-weight: 800; color: #0f172a;">SmartBill Portal</h2>
      <p style="font-size: 0.88rem; color: #64748b; margin-top: 4px;">Smart Store Billing & Inventory Management</p>
    </div>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div style="margin-bottom: 20px;">
          {% for category, message in messages %}
            <div class="badge badge-{{ category if category != 'error' else 'danger' }}" 
                 style="display: block; width: 100%; padding: 10px 14px; font-size: 0.85rem; border-radius: 6px; margin-bottom: 6px;">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="e.g. admin or cashier" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;">
        Sign In to POS
      </button>
    </form>

    <!-- Viva Demo Quick Fill -->
    <div class="demo-creds">
      <div style="font-weight: 700; color: #475569; margin-bottom: 8px;">Demo Accounts for Viva:</div>
      <div style="display: flex; gap: 8px;">
        <button type="button" class="btn btn-secondary btn-sm" style="flex: 1;" onclick="fillCreds('admin', 'admin123')">
          👤 Fill Admin
        </button>
        <button type="button" class="btn btn-secondary btn-sm" style="flex: 1;" onclick="fillCreds('cashier', 'cashier123')">
          🧾 Fill Cashier
        </button>
      </div>
    </div>
  </div>

  <script>
    function fillCreds(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
    }
  </script>
</body>
</html>
